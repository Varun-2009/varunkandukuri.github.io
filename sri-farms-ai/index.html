<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sri Farms AI Poultry Management</title>
<style>
:root{--bg:#f4f7f5;--surface:#fff;--text:#18302a;--muted:#6d7e78;--line:#dfe8e4;--accent:#1f7a4c;--accent2:#e7f4ed;--warn:#b86b00;--danger:#b42318;--shadow:0 8px 24px rgba(24,48,42,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#102c24;color:#fff;padding:22px 16px}.brand{display:flex;gap:11px;align-items:center;margin-bottom:24px}.logo{width:42px;height:42px;border-radius:12px;background:#35a86b;display:grid;place-items:center;font-weight:800}.brand span{display:block;font-size:12px;color:#b8cec5}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#d8e9e2;text-align:left;padding:11px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#1d4a3b;color:#fff}main{padding:0 24px 28px}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}.top h1{margin:0;font-size:27px}.top p{margin:5px 0 0;color:var(--muted)}.badge{font-size:12px;padding:6px 9px;border-radius:999px;background:#dff3e7;color:#17653f}.hero{padding:26px;border-radius:18px;background:linear-gradient(120deg,#153d30,#2d8056);color:#fff}.hero h2{margin:0 0 9px;font-size:30px}.hero p{color:#d7eee3;max-width:780px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,minmax(130px,1fr));margin-top:14px}.two{grid-template-columns:1.3fr 1fr;margin-top:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.label{font-size:12px;color:var(--muted)}.value{font-size:24px;font-weight:750;margin:7px 0 4px}.trend{font-size:12px;color:var(--accent)}.section{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section h3{margin:0;font-size:16px}.metric{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric div{background:#f7faf8;border:1px solid var(--line);padding:12px;border-radius:10px}.metric span{display:block;font-size:12px;color:var(--muted)}.metric strong{display:block;margin-top:4px;font-size:18px}.chart{height:190px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line)}.bar{flex:1;background:#80b99a;border-radius:5px 5px 0 0;min-height:8px}.alert{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.alert small{display:block;color:var(--muted);margin-top:3px}.warn{background:#fff1d6;color:#875100}.danger{background:#ffe4e2;color:#9d231c}.info{background:#e8f0ff;color:#315d9a}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted)}.hidden{display:none}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:8px}.primary{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:9px;cursor:pointer}.chat{display:grid;gap:10px}.chatlog{min-height:280px;display:grid;align-content:start;gap:9px}.msg{padding:10px 12px;border-radius:10px;max-width:78%}.user{justify-self:end;background:#dff1e8}.ai{background:#f4f6f5;border:1px solid var(--line)}.chatrow{display:flex;gap:8px}.chatrow input{flex:1;padding:11px;border:1px solid var(--line);border-radius:9px}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{padding-bottom:16px}.nav{grid-template-columns:repeat(2,1fr)}main{padding:0 14px 24px}.top{align-items:flex-start;flex-direction:column;gap:10px}.kpis,.two,.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><div class="logo">SF</div><div><strong>Sri Farms AI</strong><span>Poultry Management</span></div></div><div class="nav" id="nav"></div></aside>
<main><header class="top"><div><h1 id="title">Farm Dashboard</h1><p>Monitor birds. Reduce mortality. Improve FCR. Increase profitability.</p></div><span class="badge">Live Demo</span></header><section id="content"></section></main>
</div>
<script>
const db={farm:{name:'Sri Farms - Chinnagudur',capacity:12000,sheds:2,integrator:'Sneha'},flock:{id:101,breed:'Vencobb',birds:11748,initial:12000,age:15,avgWeight:.61,targetWeight:.65,feedKg:11240,harvest:'2026-10-12'},daily:[{date:'2026-09-13',mortality:15,feed:860,water:1480,temp:30.1,humidity:62,ammonia:13,ph:6.7},{date:'2026-09-14',mortality:18,feed:900,water:1540,temp:30.5,humidity:64,ammonia:15,ph:6.8},{date:'2026-09-15',mortality:21,feed:940,water:1620,temp:31.2,humidity:67,ammonia:18,ph:6.8}],expenses:[420000,730000,27000,35000,22000,15000],feed:[{type:'Starter',purchased:8000,used:5550},{type:'Grower',purchased:10000,used:5690}],alerts:[{s:'Warning',t:'Temperature above target',d:'Shed average reached 31.2°C.'},{s:'Warning',t:'Mortality increasing',d:'Daily mortality increased from 15 to 21 birds over 3 days.'},{s:'Info',t:'Vaccination due',d:'Newcastle booster is scheduled for day 21.'}]};
const pages=['Dashboard','Farms','Flocks','Daily Entry','Feed','Health','Finance','Alerts','AI Assistant'];let current='Dashboard';
const $=s=>document.querySelector(s);const money=v=>'₹'+Math.round(v).toLocaleString('en-IN');
function calc(){const f=db.flock,m=f.initial-f.birds,live=f.birds*f.avgWeight,fcr=f.feedKg/live,spent=db.expenses.reduce((a,b)=>a+b,0),rev=live*105;return{m,live,fcr,spent,rev,profit:rev-spent,d:db.daily.at(-1)}}
function kpi(l,v,t=''){return`<div class="card"><div class="label">${l}</div><div class="value">${v}</div><div class="trend">${t}</div></div>`}
function dashboard(){const c=calc(),d=c.d,rem=db.feed.reduce((s,x)=>s+x.purchased-x.used,0);return`<div class="hero"><h2>Sri Farms AI Poultry Management</h2><p>Operational view for flock health, feed, water, FCR, environment, vaccination, expenses and projected profitability.</p><div class="pills"><span class="pill">Batch ${db.flock.id}</span><span class="pill">${db.flock.breed}</span><span class="pill">Day ${db.flock.age}</span><span class="pill">${db.flock.birds.toLocaleString()} birds</span></div></div><div class="grid kpis">${kpi('Current Birds',db.flock.birds.toLocaleString(),c.m+' cumulative mortality')}${kpi('Mortality %',(c.m/db.flock.initial*100).toFixed(2)+'%',d.mortality+' today')}${kpi('Average Weight',db.flock.avgWeight+' kg','Target '+db.flock.targetWeight+' kg')}${kpi('Current FCR',c.fcr.toFixed(2),c.fcr<1.7?'Good':'Needs attention')}${kpi('Feed Remaining',rem.toLocaleString()+' kg','Inventory')}${kpi('Projected Profit',money(c.profit),'Estimate only')}</div><div class="grid two"><div class="card"><div class="section"><h3>Mortality Trend</h3></div><div class="chart">${db.daily.map(x=>`<div class="bar" style="height:${x.mortality/21*100}%" title="${x.mortality} birds"></div>`).join('')}</div></div><div class="card"><div class="section"><h3>Environment</h3></div><div class="metric"><div><span>Temperature</span><strong>${d.temp}°C</strong></div><div><span>Humidity</span><strong>${d.humidity}%</strong></div><div><span>Ammonia</span><strong>${d.ammonia} ppm</strong></div><div><span>Water pH</span><strong>${d.ph}</strong></div></div></div></div><div class="grid two"><div class="card"><div class="section"><h3>Alerts</h3></div>${db.alerts.map(a=>`<div class="alert"><div><strong>${a.t}</strong><small>${a.d}</small></div><span class="badge ${a.s==='Warning'?'warn':'info'}">${a.s}</span></div>`).join('')}</div><div class="card"><div class="section"><h3>Finance</h3></div><div class="metric"><div><span>Total Cost</span><strong>${money(c.spent)}</strong></div><div><span>Estimated Revenue</span><strong>${money(c.rev)}</strong></div><div><span>Projected Profit</span><strong>${money(c.profit)}</strong></div><div><span>Harvest</span><strong>${db.flock.harvest}</strong></div></div></div></div>`}
function farms(){return`<div class="card"><div class="section"><h3>Farms</h3></div><table class="table"><tr><th>Name</th><th>Capacity</th><th>Sheds</th><th>Integrator</th></tr><tr><td>${db.farm.name}</td><td>${db.farm.capacity.toLocaleString()}</td><td>${db.farm.sheds}</td><td>${db.farm.integrator}</td></tr></table></div>`}
function flocks(){return`<div class="card"><div class="section"><h3>Flocks / Batches</h3></div><table class="table"><tr><th>Batch</th><th>Breed</th><th>Birds</th><th>Age</th><th>Weight</th><th>Harvest</th></tr><tr><td>${db.flock.id}</td><td>${db.flock.breed}</td><td>${db.flock.birds.toLocaleString()}</td><td>${db.flock.age} days</td><td>${db.flock.avgWeight} kg</td><td>${db.flock.harvest}</td></tr></table></div>`}
function daily(){return`<div class="card"><h3>Daily Farm Entry</h3><div class="form"><div class="field"><label>Mortality</label><input id="mort" type="number" value="21"></div><div class="field"><label>Feed (kg)</label><input id="feed" type="number" value="940"></div><div class="field"><label>Water (L)</label><input id="water" type="number" value="1620"></div><div class="field"><label>Temperature °C</label><input id="temp" type="number" value="31.2"></div><div class="field"><label>Humidity %</label><input id="hum" type="number" value="67"></div><div class="field"><label>Ammonia ppm</label><input id="ammo" type="number" value="18"></div></div><p><button class="primary" onclick="saveDaily()">Save Daily Record</button></p><small class="label">This GitHub Pages demo updates in your browser only. The production project connects these screens to SQL Server/EF Core APIs.</small></div>`}
function feed(){const rem=db.feed.reduce((s,x)=>s+x.purchased-x.used,0);return`<div class="card"><div class="section"><h3>Feed Inventory</h3><span class="badge">${rem.toLocaleString()} kg remaining</span></div><table class="table"><tr><th>Type</th><th>Purchased</th><th>Used</th><th>Remaining</th></tr>${db.feed.map(x=>`<tr><td>${x.type}</td><td>${x.purchased} kg</td><td>${x.used} kg</td><td>${x.purchased-x.used} kg</td></tr>`).join('')}</table></div>`}
function health(){return`<div class="grid two"><div class="card"><h3>Vaccination</h3><div class="alert"><div><strong>Newcastle Disease</strong><small>Day 7</small></div><span class="badge">Completed</span></div><div class="alert"><div><strong>IBD / Gumboro</strong><small>Day 14</small></div><span class="badge">Completed</span></div><div class="alert"><div><strong>Newcastle Booster</strong><small>Day 21</small></div><span class="badge warn">Upcoming</span></div></div><div class="card"><h3>Medicine</h3><div class="alert"><div><strong>Electrolyte Support</strong><small>Heat stress support</small></div><span class="badge">Active</span></div></div></div>`}
function finance(){const c=calc();return`<div class="grid kpis">${kpi('Total Cost',money(c.spent))}${kpi('Estimated Revenue',money(c.rev))}${kpi('Projected Profit',money(c.profit))}${kpi('Cost / Bird',money(c.spent/db.flock.birds))}</div>`}
function alerts(){return`<div class="card"><div class="section"><h3>Active Alerts</h3></div>${db.alerts.map(a=>`<div class="alert"><div><strong>${a.t}</strong><small>${a.d}</small></div><span class="badge ${a.s==='Warning'?'warn':'info'}">${a.s}</span></div>`).join('')}</div>`}
function ai(){return`<div class="card chat"><h3>AI Poultry Assistant</h3><div id="chatlog" class="chatlog"><div class="msg ai">Ask about FCR, mortality, feed, water, or projected profit.</div></div><div class="chatrow"><input id="q" placeholder="Why did mortality increase?" onkeydown="if(event.key==='Enter')askAI()"><button class="primary" onclick="askAI()">Ask</button></div></div>`}
function askAI(){const q=$('#q').value.trim();if(!q)return;const c=calc(),l=q.toLowerCase();let a='I can answer from the current farm records.';if(l.includes('fcr'))a=`Current calculated FCR is ${c.fcr.toFixed(2)} based on cumulative feed and estimated live weight.`;else if(l.includes('mortality'))a=`Cumulative mortality is ${c.m} birds. Recent daily mortality is ${db.daily.map(x=>x.mortality).join(' → ')} birds, so the trend should be reviewed with temperature, water, feed and veterinary observations.`;else if(l.includes('feed'))a=`Current feed stock remaining is ${db.feed.reduce((s,x)=>s+x.purchased-x.used,0).toLocaleString()} kg.`;else if(l.includes('profit')||l.includes('revenue'))a=`Estimated revenue is ${money(c.rev)} and projected profit is ${money(c.profit)} using the demo sale-price assumption.`;const log=$('#chatlog');log.innerHTML+=`<div class="msg user">${q.replace(/[<>]/g,'')}</div><div class="msg ai">${a}</div>`;$('#q').value=''}
function saveDaily(){const r={date:new Date().toISOString().slice(0,10),mortality:+$('#mort').value,feed:+$('#feed').value,water:+$('#water').value,temp:+$('#temp').value,humidity:+$('#hum').value,ammonia:+$('#ammo').value,ph:6.8};db.daily.push(r);db.flock.birds=Math.max(0,db.flock.birds-r.mortality);db.flock.feedKg+=r.feed;alert('Daily record saved in this live demo session.');render()}
function render(){const map={'Dashboard':dashboard,'Farms':farms,'Flocks':flocks,'Daily Entry':daily,'Feed':feed,'Health':health,'Finance':finance,'Alerts':alerts,'AI Assistant':ai};$('#title').textContent=current==='Dashboard'?'Farm Dashboard':current;$('#content').innerHTML=map[current]();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===current))}
$('#nav').innerHTML=pages.map(p=>`<button data-p="${p}">${p}</button>`).join('');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{current=b.dataset.p;render()});render();
</script>
</body>
</html>
